server {
    listen 80;
    listen [::]:80;
    server_name ourownleads.com www.ourownleads.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ourownleads-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Enable the application only after its HTTPS certificate is installed.
    location / { return 503; }
}
