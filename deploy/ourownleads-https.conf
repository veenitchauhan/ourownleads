# Install after issuing the ourownleads.com certificate with Certbot webroot.
server {
    listen 80;
    listen [::]:80;
    server_name ourownleads.com www.ourownleads.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ourownleads-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ourownleads.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ourownleads.com;
    ssl_certificate /etc/letsencrypt/live/ourownleads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ourownleads.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://ourownleads.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ourownleads.com;
    ssl_certificate /etc/letsencrypt/live/ourownleads.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ourownleads.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;

    # Keep authorization codes and webhook verification tokens out of access logs.
    access_log off;
    error_log /var/log/nginx/ourownleads-error.log warn;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
