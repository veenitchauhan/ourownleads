<IfModule !proxy_http_module>
    LoadModule proxy_http_module lib/httpd/modules/mod_proxy_http.so
</IfModule>
<VirtualHost 127.0.0.1:443>
    ServerName ourownleads.test
    SSLEngine on
    SSLCertificateFile "/opt/homebrew/etc/httpd/certs/local-vhosts.pem"
    SSLCertificateKeyFile "/opt/homebrew/etc/httpd/certs/local-vhosts-key.pem"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    <Location />
        Require local
    </Location>
</VirtualHost>
<VirtualHost 127.0.0.1:80>
    ServerName ourownleads.test
    Redirect permanent / https://ourownleads.test/
</VirtualHost>
