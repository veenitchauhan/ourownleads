services:
  portal:
    build:
      context: ../source
    image: our-own-leads:beta
    restart: unless-stopped
    env_file: ../shared/production.env
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../shared/data:/app/data
    init: true
    mem_limit: 1536m
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/auth').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
